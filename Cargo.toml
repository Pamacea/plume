[package]
name = "plume"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
serde_json = "1"
enigo = "0.6.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # bulle clampée sur le BON moniteur (MonitorFromPoint, 3 écrans)
    "Win32_Graphics_Gdi",
    # caret via UI Automation (apps modernes sans rcCaret)
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    # icône de l'exé pour le tray (GetModuleHandleW)
    "Win32_System_LibraryLoader",
    # raccourci Démarrer + Bureau (IShellLinkW)
    "Win32_UI_Shell",
] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1"
